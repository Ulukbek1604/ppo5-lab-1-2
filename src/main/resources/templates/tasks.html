<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tasks</title>
</head>
<body>
<h1>Task List</h1>
<div th:each="task : ${tasks}">
    <p th:text="${task.name}">Task Name</p>
    <p th:text="${task.description}">Task Description</p>
    <p th:text="${task.dueDate}">Due Date</p>
    <span th:text="${task.completed ? 'Completed' : 'Pending'}">Status</span>
    <a th:href="@{/task/edit/{id}(id=${task.id})}">Edit</a>
    <form th:action="@{/task/delete/{id}(id=${task.id})}" method="post" style="display:inline">
        <button type="submit">Delete</button>
    </form>
    <hr/>
</div>
<a href="/task/new">Create New Task</a> | <a href="/">Home</a>
</body>
</html>
